<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paws & Perspectives | Live Dog Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-emerald-400">🐾 Paws & Perspectives Live Blog</h1>
            <p class="text-slate-400 mt-2">Dynamic dog discussions powered by multi-voice AI & your live material.</p>
        </header>

        <!-- Upload Portal (iPhone & Desktop Friendly) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl mb-8">
            <h2 class="text-xl font-bold text-emerald-300 mb-4">🚀 Feed & Control Hub</h2>
            <form id="upload-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Notes / Subject Matter</label>
                        <textarea name="notes" rows="2" placeholder="Paste article text, food review notes, weather tips..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">YouTube Link / Media</label>
                        <input type="text" name="youtube_url" placeholder="https://youtube.com/watch?v=..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm mb-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                        <input type="file" name="media" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400 cursor-pointer">
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl hover:bg-emerald-400 transition cursor-pointer">Generate Live Discussion</button>
            </form>
        </div>

        <!-- Live Conversation Stream -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-300 mb-6 flex items-center justify-between">
                <span>💬 Active Conversation Stream</span>
                <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
            </h2>
            
            <div id="chat-stream" class="space-y-4 max-h-[500px] overflow-y-auto pr-2"></div>

            <!-- Interjection Box -->
            <div class="mt-6 pt-4 border-t border-slate-800 flex gap-2">
                <input type="text" id="interject-input" placeholder="Interject your comment or question here..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                <button onclick="sendInterjection()" class="bg-amber-500 text-slate-950 font-bold px-6 py-3 rounded-xl hover:bg-amber-400 transition cursor-pointer">Interject</button>
            </div>
        </div>
    </div>

    <script>
        async function fetchState() {
            const res = await fetch('/api/state');
            const data = await res.json();
            renderDialogue(data.dialogue);
        }

        function renderDialogue(dialogue) {
            const container = document.getElementById('chat-stream');
            container.innerHTML = dialogue.map(item => `
                <div class="flex items-start space-x-3 p-4 rounded-xl ${item.speaker.includes('You') ? 'bg-amber-950/40 border border-amber-800/50' : 'bg-slate-950/60 border border-slate-800'}">
                    <div class="w-10 h-10 rounded-full ${item.speaker.includes('You') ? 'bg-amber-500' : 'bg-emerald-500'} flex items-center justify-center font-bold text-slate-950 shrink-0">${item.initials}</div>
                    <div class="flex-1">
                        <span class="text-xs font-semibold ${item.speaker.includes('You') ? 'text-amber-400' : 'text-emerald-400'}">${item.speaker}</span>
                        <p class="text-sm mt-1 text-slate-200">${item.text}</p>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/api/ingest', { method: 'POST', body: formData });
            const data = await res.json();
            renderDialogue(data.dialogue);
            e.target.reset();
        });

        async function sendInterjection() {
            const input = document.getElementById('interject-input');
            const comment = input.value.trim();
            if(!comment) return;
            const res = await fetch('/api/interject', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ comment })
            });
            const data = await res.json();
            renderDialogue(data.dialogue);
            input.value = '';
        }

        fetchState();
    </script>
</body>
</html>
